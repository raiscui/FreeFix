# `my7_colmap_fastgs` 的 35k FreeFix 契约配置。
# 这轮先不直接启动 FreeFix 长训。
# 这份文件主要用于生成 `cfg.json`, 让 FastGS bridge checkpoint 能在 FreeFix refine 链路里被正确消费。

disable_viewer: true
ckpt: null
data_type: colmap

# 继续直接复用外部 COLMAP 场景目录。
data_dir: /home/rais/FastGS/data/my7_colmap_fastgs
data_factor: 1
result_dir: outputs/my7_colmap_fastgs_stable_35k_dense
test_every: 8
patch_size: null
global_scale: 1.0

port: 8080
batch_size: 1
steps_scaler: 1.0

# 保持和 `my6 35k` 一致的训练口径。
# 即便本轮不真实训练, 也要让 `cfg.json` 契约和后续 refine 假设保持一致。
max_steps: 35000
eval_steps: [12000, 30000, 35000]
save_steps: [12000, 30000, 35000]
render_video_steps: [12000, 30000, 35000]
render_video_interp: 0

init_type: sfm
init_num_pts: 100000
init_extent: 3.0
sh_degree: 3
sh_degree_interval: 1000
init_opa: 0.1
init_scale: 1.0
ssim_lambda: 0.2

near_plane: 0.01
far_plane: 10000000000.0

strategy: default
prune_opa: 0.005
grow_grad2d: 0.0002
grow_scale3d: 0.01
prune_scale3d: 0.1
refine_start_iter: 500
refine_stop_iter: 9000
reset_every: 3000
refine_every: 200

packed: false
sparse_grad: false
absgrad: false
antialiased: false
revised_opacity: false

random_bkgd: false

pose_opt: true
pose_opt_lr: 0.00001
pose_opt_reg: 0.000001
pose_noise: 0.0

app_opt: false
app_embed_dim: 16
app_opt_lr: 0.001
app_opt_reg: 0.000001

depth_loss: true
depth_lambda: 0.01

tb_every: 100
tb_save_image: false

c_exp_index: [0.001, 0.01, 0.1]
