# `outputs/my4/cfg.json` 的可复现 YAML 版本。
# 注意:
# - 这里的 `partition` 保持“输入态”写法, 只写文件名。
# - `recon.trainer` 运行时会自动把它拼成 `data_dir/partition.json`。

disable_viewer: false
ckpt: null
data_type: colmap

data_dir: data/my4
data_factor: 1
result_dir: outputs/my4
test_every: 1
patch_size: null
global_scale: 1.0
partition: partition.json

port: 8080
batch_size: 1
steps_scaler: 1.0

max_steps: 30000
eval_steps: [7000, 30000]
save_steps: [7000, 30000]

init_type: sfm
init_num_pts: 100000
init_extent: 3.0
sh_degree: 3
sh_degree_interval: 1000
init_opa: 0.1
init_scale: 1.0
ssim_lambda: 0.2

near_plane: 0.01
far_plane: 10000000000.0

strategy: default
prune_opa: 0.005
grow_grad2d: 0.0002
grow_scale3d: 0.01
prune_scale3d: 0.1
refine_start_iter: 500
refine_stop_iter: 15000
reset_every: 3000
refine_every: 200

packed: false
sparse_grad: false
absgrad: false
antialiased: false
revised_opacity: false

random_bkgd: false

pose_opt: false
pose_opt_lr: 0.00001
pose_opt_reg: 0.000001
pose_noise: 0.0

app_opt: false
app_embed_dim: 16
app_opt_lr: 0.001
app_opt_reg: 0.000001

depth_loss: false
depth_lambda: 0.01

tb_every: 100
tb_save_image: false

c_exp_index: [0.001, 0.01, 0.1]
