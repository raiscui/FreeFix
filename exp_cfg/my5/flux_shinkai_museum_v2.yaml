# `my5_colmap_fastgs stable_12k_dense @ 11999` 的 Flux refine 配置。
# 这轮先沿用 `my4` 已跑通的 Flux 参数, 只把场景和索引范围对齐到 `my5`。
# 注意: 这里两组索引不是同一个数据集空间。
# - `refine_*` 索引的是 `test_dataset`
# - `train_*` 索引的是 `train_dataset`

base_dir: outputs/my5_colmap_fastgs_stable_12k_dense
exp_name: flux_shinkai_museum_v2

# 当前 `my5` 在 `test_every: 8` 下的真实 test 长度是 41。
refine_start_idx: 0
refine_end_idx: 41

# 当前 `my5` 在同一切分下的真实 train 长度是 283。
train_start_idx: 0
train_end_idx: 283

test_split: test
test_trans: [0, 0, 0]
test_rots: [0, 0, 0]

prompt: "high detail. Refine images, repair visual errors and blurriness in AI-generated images, perform defogging and enhance clarity. Correct unreasonable elements, data errors and illogical content in the images, remove ghosting, and boost details, textures and edges."

# 继续沿用 `my4` 里已经跑通的一组参数。
# 先保证流程稳定, 不在这一轮同时改风格化超参数。
strength: 0.65
refine_steps: 400
warp_ratio: 0.3

hessian_attr: ["means", "quats", "scales"]

data_type: colmap
load_step: 11999

# 当前机器已准备好本地 Flux 快照。
# 显式写路径, 避免运行时再次回退到远端 gated repo。
flux_model_path: /home/rais/.cache/modelscope/hub/models/black-forest-labs/FLUX___1-dev
