# `my5_colmap_fastgs` 的稳态短训配置。
# 这轮直接复用 `my4 stable_12k_dense` 的训练策略。
# 目标是先拿到一套和 `my4` 参数口径一致的 `my5` 基线结果。

disable_viewer: true
ckpt: null
data_type: colmap

# 直接使用用户给出的外部 COLMAP 场景目录。
# 当前目录已经有 `images/` 和 `sparse/0`, 不需要再额外导入到仓库 `data/` 下。
data_dir: /home/rais/FastGS/data/my5_colmap_fastgs
data_factor: 1
result_dir: outputs/my5_colmap_fastgs_stable_12k_dense
test_every: 8
patch_size: null
global_scale: 1.0

# 先沿用 `my4` 这条无 partition 的稳态线。
# 如果后续为 `my5` 补了专用 `partition.json`, 再改成显式分片。
# partition: partition.json

port: 8080
batch_size: 1
steps_scaler: 1.0

# 训练窗口保持和 `my4 stable_12k_dense` 一致。
max_steps: 12000
eval_steps: [9000, 10000, 11000, 12000]
save_steps: [9000, 10000, 11000, 12000]

# 训练过程中按 checkpoint 节奏自动导出轨迹视频。
# 这组 step 和 `save_steps` 对齐, 输出会保留成:
# - `render_ckpt_8999.mp4`
# - `alpha_ckpt_8999.mp4`
# - ...
render_video_steps: [9000, 10000, 11000, 12000]
render_video_interp: 0

init_type: sfm
init_num_pts: 100000
init_extent: 3.0
sh_degree: 3
sh_degree_interval: 1000
init_opa: 0.1
init_scale: 1.0
ssim_lambda: 0.2

near_plane: 0.01
far_plane: 10000000000.0

strategy: default
prune_opa: 0.005
grow_grad2d: 0.0002
grow_scale3d: 0.01
prune_scale3d: 0.1
refine_start_iter: 500

# 保持 9k 停止 densify。
# 这样更容易和 `my4` 的稳态结果做横向比较。
refine_stop_iter: 9000
reset_every: 3000
refine_every: 200

packed: false
sparse_grad: false
absgrad: false
antialiased: false
revised_opacity: false

random_bkgd: false

pose_opt: true
pose_opt_lr: 0.00001
pose_opt_reg: 0.000001
pose_noise: 0.0

app_opt: false
app_embed_dim: 16
app_opt_lr: 0.001
app_opt_reg: 0.000001

depth_loss: true
depth_lambda: 0.01

tb_every: 100
tb_save_image: false

c_exp_index: [0.001, 0.01, 0.1]
