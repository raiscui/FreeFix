# `my5` 的 net-prune smoke test 配置。
# 目标:
# - 在 `safe_cleanup` 基础上, 通过 runtime strategy override
#   轻度提高 prune 强度并轻度抬高 grow 门槛
# - 不改 `<base_dir>/cfg.json`
# - 先做 25 plan bounded smoke test, 看能否接近“轻度净消减”

base_dir: outputs/my5_colmap_fastgs_stable_35k_dense
exp_name: my5_pose_jitter_v5_net_prune_smoke

refine_start_idx: 0
refine_end_idx: 41

train_start_idx: 0
train_end_idx: 283

test_split: test
test_trans: [0, 0, 0]
test_rots: [0, 0, 0]

prompt: "Clean repair pass. Remove ghosting, blur, and compression artifacts while preserving the current view, geometry, silhouettes, and object boundaries. Do not invent new detail."
negative_prompt: "extra details, double edges, duplicate contours, halo, ghost image, oversharpening, crunchy detail, noisy texture, clutter, text"

kontext_prompt: "Clean stable repair. Remove ghosting and blur. Keep current structure, silhouettes, and edges. Do not add detail or sharpen."
kontext_negative_prompt: "extra details, duplicate edges, double contours, halos, ghosting, oversharpening, crunchy detail, noisy texture, clutter, dust, grain"

strength: 0.50
refine_steps: 250
warp_ratio: 0.05
gen_prob: 0.10

# ------------------------------------------------------------------
# safe cleanup window + light net-prune bias
# ------------------------------------------------------------------
refine_virtual_step: 100
refine_start_iter: 200
refine_stop_iter: 1200
reset_every: 999999
refine_every: 400

# runtime strategy overrides:
# - 稍微提高 prune 阈值, 让低 opacity GS 更容易被清掉
# - 稍微提高 grow 门槛, 减少 grow/split 触发
prune_opa: 0.006
grow_grad2d: 0.0003

hessian_attr: ["means"]

data_type: colmap
load_step: 35000
load_ckpt_path: outputs/my5_colmap_fastgs_stable_35k_dense/ckpts/ckpt_flux_shinkai_museum_v2_fastgs_my5_nomask_v1_35000_fixsh_rerun.pt

flux_model_path: /home/rais/.cache/modelscope/hub/models/black-forest-labs/FLUX.1-dev
refine_pipeline_offload_mode: none

refine_camera_mode: pose_jitter
refine_train_splits: [train]
refine_camera_source_splits: [train]
pose_jitter_views_per_source: 1/3

pose_jitter_trans_sigma: [0.10, 0.10, 0.10]
pose_jitter_trans_max: [0.50, 0.50, 0.50]
pose_jitter_trans_radius_mode: neighbor_average_radius
pose_jitter_neighbor_window: 1
pose_jitter_neighbor_radius_scale: 0.85
pose_jitter_rot_sigma_deg: [0.8, 0.8, 0.8]
pose_jitter_rot_max_deg: [1.5, 1.5, 1.5]
pose_jitter_max_attempts: 4
pose_jitter_alpha_threshold: 0.05
pose_jitter_min_alpha_coverage: 0.03

kontext_model_path: /home/rais/.cache/modelscope/hub/models/black-forest-labs/FLUX.1-Kontext-dev
kontext_strength: 0.40
kontext_num_inference_steps: 45
kontext_guidance_scale: 2.5
