# `my5` 的正式多 split / 多 jitter refine 配置。
# 这轮按用户要求:
# - synthetic source pool 吃满 train + test 全部镜头
# - 每个基镜头抖出 3 个视角
# - jitter 再比上一轮 stronger 更大一档

base_dir: outputs/my5_colmap_fastgs_stable_35k_dense
exp_name: flux_shinkai_museum_v2_pose_jitter_train_test_x3_20260330

# ------------------------------------------------------------------
# fixed-view 对比仍然保留一小段固定窗口, 便于 before / after 直接对照。
# synthetic supervise 则不再受这个窗口限制, 会由下面的多 split plan 单独展开。
# ------------------------------------------------------------------
refine_start_idx: 0
refine_end_idx: 100

train_start_idx: 0
train_end_idx: 283

test_split: train
test_trans: [0, 0, 0]
test_rots: [0, 0, 0]

prompt: "high detail. Refine images, Ghost artifact removal, image quality enhancement, and restoration of compression artifacts. repair visual errors and blurriness in AI-generated images, perform defogging and enhance clarity. Correct unreasonable elements, data errors and illogical content in the images, remove ghosting, and boost details, textures and edges."

strength: 0.65
refine_steps: 400
warp_ratio: 0.3

hessian_attr: ["means", "quats", "scales"]

data_type: colmap
load_step: 35000
load_ckpt_path: outputs/my5_colmap_fastgs_stable_35k_dense/ckpts/ckpt_flux_shinkai_museum_v2_fastgs_my5_nomask_v1_35000_fixsh_rerun.pt

flux_model_path: /home/rais/.cache/modelscope/hub/models/black-forest-labs/FLUX.1-dev
refine_pipeline_offload_mode: none

refine_camera_mode: pose_jitter

# ------------------------------------------------------------------
# 真实监督池和 synthetic source pool 都吃满 train + test。
# 这会污染 benchmark 语义, 但这是这轮任务的明确目标。
# 如果当前场景总镜头数是 324, 那么 synthetic plan 会是 324 * 3 = 972。
# ------------------------------------------------------------------
refine_train_splits: [train, test]
refine_camera_source_splits: [train, test]
pose_jitter_views_per_source: 3

# ------------------------------------------------------------------
# 比上一轮 stronger 再放大一档。
# 目标不是极端跳视角, 而是让 synthetic render 明显离开原镜头,
# 逼着 Flux 去补局部新视角的外观细节。
# ------------------------------------------------------------------
pose_jitter_trans_sigma: [0.05, 0.05, 0.05]
pose_jitter_trans_max: [0.10, 0.10, 0.10]
pose_jitter_rot_sigma_deg: [5.0, 5.0, 5.0]
pose_jitter_rot_max_deg: [10.0, 10.0, 10.0]
pose_jitter_max_attempts: 4
pose_jitter_alpha_threshold: 0.05
pose_jitter_min_alpha_coverage: 0.01
