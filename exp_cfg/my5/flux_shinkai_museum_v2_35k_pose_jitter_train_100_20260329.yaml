# `my5_colmap_fastgs_stable_35k_dense @ 34999` 的正式 pose-jitter refine 配置。
# 这次不是 3 帧 smoke, 而是围绕 train split 的前 100 帧做正式运行。
# 之所以不用原 test split, 是因为原正式配置只覆盖 41 帧, 直接拉到 100 会越界。

base_dir: outputs/my5_colmap_fastgs_stable_35k_dense
exp_name: flux_shinkai_museum_v2_pose_jitter_train_100_20260329

refine_start_idx: 0
refine_end_idx: 100

train_start_idx: 0
train_end_idx: 283

# 这里显式改成 train, 让 before/after 固定视角对齐到同一批 100 张训练镜头。
test_split: train
test_trans: [0, 0, 0]
test_rots: [0, 0, 0]

prompt: "high detail. Refine images, repair visual errors and blurriness in AI-generated images, perform defogging and enhance clarity. Correct unreasonable elements, data errors and illogical content in the images, remove ghosting, and boost details, textures and edges."

strength: 0.65
refine_steps: 400
warp_ratio: 0.3

hessian_attr: ["means", "quats", "scales"]

data_type: colmap
# 这里显式指向当前工作区里真实存在的 `my5` 正式 refine 基线。
# 该 checkpoint 自己的 `step=-1`, 所以同时保留 `load_step: 35000`
# 作为 strategy resume step 的回退时间轴。
load_step: 35000
load_ckpt_path: outputs/my5_colmap_fastgs_stable_35k_dense/ckpts/ckpt_flux_shinkai_museum_v2_fastgs_my5_nomask_v1_35000_fixsh_rerun.pt

flux_model_path: /home/rais/.cache/modelscope/hub/models/black-forest-labs/FLUX___1-dev

# 本机默认 `pipe.to(cuda)` 真实跑过会长时间阻塞, 正式任务也继续走已验证的 offload 路径。
refine_pipeline_offload_mode: model_cpu

# 只在 synthetic supervise 渲染阶段围绕 train 镜头做受控小抖动。
refine_camera_mode: pose_jitter
refine_camera_source_split: train
pose_jitter_trans_sigma: [0.01, 0.01, 0.01]
pose_jitter_trans_max: [0.02, 0.02, 0.02]
pose_jitter_rot_sigma_deg: [1.0, 1.0, 1.0]
pose_jitter_rot_max_deg: [2.0, 2.0, 2.0]
pose_jitter_max_attempts: 2
pose_jitter_alpha_threshold: 0.05
pose_jitter_min_alpha_coverage: 0.01
