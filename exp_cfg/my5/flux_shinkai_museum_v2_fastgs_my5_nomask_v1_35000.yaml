# 基于 FastGS `my5_nomask_v1/ckpt_35000.pth` 的专用 Flux refine 配置。
# 这里复用 FreeFix `35k` 主线的 `cfg.json` 作为数据和训练契约来源,
# 但单独开一个 `exp_name`, 避免污染已有 `my5` refine / eval 目录。

base_dir: outputs/my5_colmap_fastgs_stable_35k_dense
exp_name: flux_shinkai_museum_v2_fastgs_my5_nomask_v1_35000

refine_start_idx: 0
refine_end_idx: 41

train_start_idx: 0
train_end_idx: 283

test_split: test
test_trans: [0, 0, 0]
test_rots: [0, 0, 0]

prompt: "high detail. Refine images, repair visual errors and blurriness in AI-generated images, perform defogging and enhance clarity. Correct unreasonable elements, data errors and illogical content in the images, remove ghosting, and boost details, textures and edges."

# 先沿用当前 `35k` 主线的 refine 强度。
# 这次重点先验证外部 FastGS checkpoint 的桥接与 refine 链路。
strength: 0.65
refine_steps: 400
warp_ratio: 0.3

hessian_attr: ["means", "quats", "scales"]

data_type: colmap
load_step: 35000

flux_model_path: /home/rais/.cache/modelscope/hub/models/black-forest-labs/FLUX___1-dev
