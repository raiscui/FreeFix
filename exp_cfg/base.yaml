exp_name: exp00
gs_cfg_file: "cfg.json"
test_split: test_right
test_trans: [ 0, 0, 0 ] # meters
test_rots: [ 0, 0, 0 ] # degrees
refine_pipeline_offload_mode: none # none 保持旧行为; model_cpu / sequential_cpu 用于大模型 refine 卡在 pipe.to(cuda) 时的绕行路径
refine_resume_enabled: true # 是否启用 refine 断点恢复状态落盘与 rolling checkpoint
refine_resume_save_every_plans: 25 # 每完成多少条 synthetic plan 保存一次恢复 checkpoint; 最后一条总会额外保存
refine_fixed_render_batch_size: 8 # before_refine / after_refine 固定视角导出时的 batch rasterize 大小
refine_camera_mode: fixed # fixed 保持现有视角; pose_jitter 只在中间 synthetic supervise 渲染阶段做局部位姿扰动, before/after 对比仍然走固定视角
refine_camera_source_split: train # 旧模式下 pose_jitter 围绕哪组真实相机采样。默认不要直接复用 benchmark eval split
refine_train_splits: null # 新模式: null 保持旧的 train_start_idx/train_end_idx; 可设为 [train, test] 或 all, 表示把这些 split 的全部真实镜头纳入真实监督池, 会污染 benchmark
refine_camera_source_splits: null # 新模式: null 保持旧的 refine_start_idx/refine_end_idx + refine_camera_source_split; 可设为 [train, test] 或 all, 表示把这些 split 的全部镜头都作为 synthetic source pool
pose_jitter_views_per_source: 1 # 每个基镜头展开多少个 jitter synthetic 视角, 例如 train+test 共 324 镜头时, 设为 3 就会得到 972 条 synthetic plan
pose_jitter_trans_sigma: [ 0.02, 0.02, 0.02 ] # meters, 相机局部 xyz 平移高斯采样标准差
pose_jitter_trans_max: [ 0.05, 0.05, 0.05 ] # meters, 平移硬上限, 超过后会被裁剪
pose_jitter_rot_sigma_deg: [ 1.5, 1.5, 1.5 ] # degrees, 相机局部 xyz 欧拉角高斯采样标准差
pose_jitter_rot_max_deg: [ 4.0, 4.0, 4.0 ] # degrees, 旋转硬上限, 超过后会被裁剪
pose_jitter_max_attempts: 4 # 连续采样失败时最多重试次数, 用完后回退到 base camera
pose_jitter_alpha_threshold: 0.05 # 计算 alpha 有效覆盖率时的像素阈值
pose_jitter_min_alpha_coverage: 0.05 # synthetic 视角最低有效覆盖率, 不满足就触发重采样或 fallback
hessian_attr: [ "means" ] # [ "means", "quats", "scales" ]
c_exp_index: [ 0.001, 0.01, 0.1 ]
c_scheduler: [ 0.3, 0.9, 1.0 ]
negative_prompt: "blurry, low quality, foggy, overall gray, subtitles, incomplete, ghost image, too close to camera"
strength: 0.5
num_inference_steps: 50
guide_ratio: 1.0
warp_ratio: 0.5
refine_max: 5
refine_steps: 300
gen_prob: 0.1
gen_loss_weight: 0.2
affine: True
eval: False
load_step: 29999
