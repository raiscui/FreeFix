exp_name: exp00
gs_cfg_file: "cfg.json"
test_split: test_right
test_trans: [ 0, 0, 0 ] # meters
test_rots: [ 0, 0, 0 ] # degrees
refine_pipeline_offload_mode: none # none 保持旧行为; model_cpu / sequential_cpu 用于大模型 refine 卡在 pipe.to(cuda) 时的绕行路径
refine_resume_enabled: true # 是否启用 refine 断点恢复状态落盘与 rolling checkpoint
refine_resume_save_every_plans: 25 # 每完成多少条 synthetic plan 保存一次恢复 checkpoint; 最后一条总会额外保存
refine_fixed_render_batch_size: 8 # before_refine / after_refine 固定视角导出时的 batch rasterize 大小
refine_camera_mode: fixed # fixed 保持现有视角; pose_jitter 只在中间 synthetic supervise 渲染阶段做局部位姿扰动, before/after 对比仍然走固定视角
refine_camera_source_split: train # 旧模式下 pose_jitter 围绕哪组真实相机采样。默认不要直接复用 benchmark eval split
refine_train_splits: null # 新模式: null 保持旧的 train_start_idx/train_end_idx; 可设为 [train, test] 或 all, 表示把这些 split 的全部真实镜头纳入真实监督池, 会污染 benchmark
refine_camera_source_splits: null # 新模式: null 保持旧的 refine_start_idx/refine_end_idx + refine_camera_source_split; 可设为 [train, test] 或 all, 表示把这些 split 的全部镜头都作为 synthetic source pool
pose_jitter_views_per_source: 1 # 支持正整数或 `a/b` 分数。整数表示每个基镜头重复多少次; 例如 3 -> train+test 共 324 镜头时会得到 972 条 synthetic plan。分数表示按固定比例稳定抽样 source pool; 例如 `1/2` 表示每 2 个 source 保留 1 个
pose_jitter_trans_sigma: [ 0.02, 0.02, 0.02 ] # meters, 相机局部 xyz 平移高斯采样标准差
pose_jitter_trans_max: [ 0.05, 0.05, 0.05 ] # meters, 平移硬上限, 超过后会被裁剪
pose_jitter_trans_radius_mode: disabled # disabled 保持旧行为; neighbor_average_radius 表示用相邻镜头平均距离作为平移半径 cap
pose_jitter_neighbor_window: 1 # 1 表示“前一个 + 后一个”; 2 表示“前后各两个”
pose_jitter_neighbor_radius_scale: 1.0 # 对相邻镜头平均半径再乘一个缩放系数, 便于保守或放大
pose_jitter_rot_sigma_deg: [ 1.5, 1.5, 1.5 ] # degrees, 相机局部 xyz 欧拉角高斯采样标准差
pose_jitter_rot_max_deg: [ 4.0, 4.0, 4.0 ] # degrees, 旋转硬上限, 超过后会被裁剪
pose_jitter_max_attempts: 4 # 连续采样失败时最多重试次数, 用完后回退到 base camera
pose_jitter_alpha_threshold: 0.05 # 计算 alpha 有效覆盖率时的像素阈值
pose_jitter_min_alpha_coverage: 0.05 # synthetic 视角最低有效覆盖率, 不满足就触发重采样或 fallback
hessian_attr: [ "means" ] # [ "means", "quats", "scales" ]
c_exp_index: [ 0.001, 0.01, 0.1 ]
c_scheduler: [ 0.3, 0.9, 1.0 ]
negative_prompt: "blurry, low quality, foggy, overall gray, subtitles, incomplete, ghost image, too close to camera"
strength: 0.5
num_inference_steps: 50
# refine backend 随机种子:
# - 默认 `refine_seed=64`, 让 Flux/Kontext 在不显式覆盖时保持固定 seed
# - 若要单独覆盖某条 backend, 可在实验 yaml 里写 `flux_seed` 或 `kontext_seed`
refine_seed: 64
flux_seed: null
kontext_seed: null
kontext_model_path: null # Kontext 可选 backend 的独立模型路径; 留空时优先尝试本地缓存, 再回退官方 repo id
kontext_prompt: null # Kontext 可单独覆盖主 prompt; 留空时回退 `prompt`, 并自动追加“修瑕疵 + 保持当前视角/结构”的修复指令
kontext_negative_prompt: null # Kontext 可单独覆盖 negative prompt; 适合压制“额外细节 / 乱纹理 / 过锐化”而不复用主链的泛化增强口径
kontext_strength: 0.5 # Kontext 默认沿用主 refine strength, 但这里可以单独覆盖
kontext_num_inference_steps: 50 # Kontext 默认沿用主 refine 步数, 可在这里单独覆盖
kontext_guidance_scale: 2.5 # Kontext 官方示例更接近 2.5, 与现有 flux 私有 pipeline 的 3.5 不完全等价
guide_ratio: 1.0
warp_ratio: 0.5
refine_max: 5
refine_steps: 300
# strategy 的阈值比较默认沿用真实训练时间轴。
# 若希望 mature checkpoint 的 refine 真正触发 prune / reset 窗口,
# 可显式设置 `refine_virtual_step`, 例如 100。
refine_virtual_step: null
# 下面四个默认值对齐当前 refine 里原本硬编码的 DefaultStrategy 参数。
# 如果你要做“cleanup-oriented refine”, 可以在实验 yaml 里按需覆盖。
refine_start_iter: 100
refine_stop_iter: 5000
reset_every: 1500
refine_every: 200
# 下面四个默认值对齐底层场景 cfg / strategy 默认值。
# 若想做“轻度净消减”实验, 优先在实验 yaml 覆盖 `prune_opa / grow_grad2d`,
# 不要直接改 `<base_dir>/cfg.json`。
prune_opa: null
grow_grad2d: null
grow_scale3d: null
prune_scale3d: null
gen_prob: 0.1
gen_loss_weight: 0.2
affine: True
eval: False
load_step: 29999
