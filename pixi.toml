[workspace]
authors = ["hyzhou"]
# Blackwell 迁移后, 这里必须和 `torch cu128` 对齐到 12.8 线.
# 不能直接写裸 `nvidia`, 因为当前通用 channel 已经漂到 13.x.
# 用 12.8.1 label 能把整套 CUDA 子包稳定锁在同一条版本线上.
channels = ["nvidia/label/cuda-12.8.1", "conda-forge"]
name = "freefix"
platforms = ["linux-64"]
version = "0.1.0"

[dependencies]
python = "==3.11.10"
setuptools = "==78.1.0"
# 这里显式补一套 12.8.1 toolkit, 让本地 CUDA 扩展和 `torch cu128` 使用同一条工具链.
# pixi 当前会把真正的 toolkit 根放到 `.pixi/envs/default/targets/x86_64-linux`,
# 代码里的运行时引导和 `.envrc` 都会按这套布局补齐 `CUDA_HOME` / `PATH`.
cuda-toolkit = { version = "==12.8.1", channel = "nvidia/label/cuda-12.8.1" }

[pypi-options]
# 这些包都依赖当前环境里的构建工具链或运行时库.
# `unidepth` 是 editable path package, `fisher_rasterize` 若后续接回也会吃当前工具链.
# `xformers 0.0.30` 走官方轮子即可, 这里不再为已经移除的包保留特殊构建分支.
no-build-isolation = ["fisher_rasterize", "unidepth"]

[pypi-dependencies]
# Blackwell 最小探针已经验证通过的底座.
torch = { version = "==2.7.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.22.0", index = "https://download.pytorch.org/whl/cu128" }
# `unidepth` 自己只写了 `torchaudio>=2.4.0`, 不钉死就会把 solver 漂到更高 torch 线.
torchaudio = { version = "==2.7.0", index = "https://download.pytorch.org/whl/cu128" }
torchmetrics = ">=1.7.1, <2"
tqdm = ">=4.67.1, <5"
huggingface-hub = ">=0.34.0"
# `unidepth` 的动态依赖声明要求 `numpy>=2.0.0`, 这里必须和它保持一致, 否则 PyPI 求解会直接失败.
numpy = ">=2.0.0"
# numpy = ">=1.24.3, <2"
iopath = ">=0.1.10, <0.2"
# diffusers = ">=0.33.1, <0.34"
gsplat = "==1.1.1"
transformers = ">=4.52.4, <5"
accelerate = ">=1.7.0, <2"
viser = ">=0.2.23, <0.3"
scikit-learn = ">=1.6.1, <2"
opencv-python = ">=4.11.0.86, <5"
tyro = ">=0.9.24, <0.10"
pillow = ">=11.2.1, <12"
tensorboard = ">=2.19.0, <3"
matplotlib = ">=3.10.3, <4"
imageio-ffmpeg = ">=0.6.0, <0.7"
imageio = ">=2.37.0, <3"
open3d = ">=0.18.0, <0.19"
ipdb = ">=0.13.13, <0.14"
ftfy = ">=6.3.1, <7"
einops = ">=0.8.1, <0.9"
roma = ">=1.5.3, <2"
sentencepiece = ">=0.2.0, <0.3"
fire = ">=0.7.0, <0.8"
ninja = ">=1.11.1.4, <2"
omegaconf = ">=2.3.0, <3"

# 安装来源:
# `pytorch3d` 在仓库里没有直接 Python import, `UniDepth` 只复用了本地拷贝的头文件,
# 所以这里先从主依赖栈里移除, 避免把 Blackwell 迁移继续绑死在它的源码构建上.
pycolmap = { git = "https://github.com/rmbrualla/pycolmap.git", rev = "cc7ea4b7301720ac29287dbe450952511b32125e" }
diffusers = { git = "https://github.com/huggingface/diffusers.git", rev = "main" }
# `xformers 0.0.30` 官方已提供 `torch 2.7.0` 的 `cu128` 轮子.
xformers = { version = "==0.0.30", index = "https://download.pytorch.org/whl/cu128" }
unidepth = { path = "submodules/UniDepth", editable=true }
torch-fidelity = ">=0.3.0, <0.4"
pytorch-fid = ">=0.3.0, <0.4"
